[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackerlens"
version = "0.1.0"
description = "Find third-party tracking signals in browser HAR captures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
trackerlens = "trackerlens.cli:main"

[tool.setuptools]
packages = ["trackerlens"]
